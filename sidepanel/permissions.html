<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Cấp quyền thiết bị — Screen Productivity</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f6f7f9;
        color: #1a2233;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14171c; color: #eaecef; }
        .card { background: #1c2027 !important; border-color: #2c323b !important; }
      }
      .card {
        max-width: 440px;
        background: #fff;
        border: 1px solid #e2e5ea;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
      }
      h1 { font-size: 19px; margin: 0 0 10px; }
      p { font-size: 14px; line-height: 1.6; color: #626b7a; margin: 0 0 20px; }
      .status {
        font-size: 14px;
        font-weight: 600;
        padding: 12px;
        border-radius: 10px;
        background: #e9f0ff;
        color: #1e4fd0;
      }
      .status.ok { background: #e6f7f0; color: #0c7a55; }
      .status.err { background: #fdecec; color: #c62a23; }
      button {
        margin-top: 16px;
        border: none;
        background: #2f6bff;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 22px;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Cấp quyền Micro &amp; Camera</h1>
      <p>
        Trình duyệt sẽ hỏi quyền truy cập thiết bị. Hãy bấm
        <b>Cho phép / Allow</b> ở hộp thoại phía trên. Bạn chỉ cần làm việc này
        <b>một lần</b> — sau đó quay lại cửa sổ extension.
      </p>
      <div id="status" class="status">Đang chờ bạn cấp quyền…</div>
      <button id="retry" style="display: none">Thử lại</button>
    </div>
    <script src="permissions.js"></script>
  </body>
</html>
